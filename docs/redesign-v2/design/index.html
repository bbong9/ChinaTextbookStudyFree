<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课本乐园 v2 · 横屏卡通版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
:root{--ink:#3A2A1A;--page:#EEF3F8;--card:#fff;--muted:#5B6B7C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:#1F2A37;font-family:'Noto Sans SC','PingFang SC',system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #DDE6EF;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-family:'ZCOOL KuaiLe',sans-serif;font-weight:400;font-size:24px;margin:0;color:#E2700A}
header nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
header nav a{font-size:13px;color:#33475B;text-decoration:none;padding:4px 10px;border-radius:12px;background:#F1F5F9}
header nav a:hover{background:#FFE9C7}
.zoom{display:flex;gap:4px}
.zoom button{border:1px solid #DDE6EF;background:#fff;border-radius:10px;padding:5px 10px;font:700 13px 'Noto Sans SC';cursor:pointer;color:#33475B}
.zoom button.on{background:#FF8A00;color:#fff;border-color:#FF8A00}
main{padding:20px 24px 80px;max-width:1900px;margin:0 auto}
.intro{background:#fff;border-radius:18px;padding:16px 20px;margin-bottom:24px;line-height:1.7;font-size:14px;color:#33475B;border:1px solid #E3EBF3}
.intro b{color:#E2700A}
h2.grp{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:26px;margin:28px 0 12px;color:#1F2A37}
.grid{display:flex;flex-wrap:wrap;gap:28px 28px}
figure{margin:0}
.bezel{background:#16181D;border-radius:56px;padding:12px;box-shadow:0 20px 40px rgba(20,40,70,.18);position:relative}
.bezel::before{content:"";position:absolute;left:4px;top:50%;width:4px;height:60px;margin-top:-30px;border-radius:2px;background:#16181D}
.holder{overflow:hidden;border-radius:44px;position:relative}
.scale{transform-origin:0 0;position:absolute;left:0;top:0}
figcaption{max-width:100%;padding:12px 6px 0;display:flex;flex-direction:column;gap:4px}
figcaption .t{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px}
figcaption .t .tag{font-size:11px;font-weight:700;color:#0B7A5D;background:#DDF6EC;border-radius:8px;padding:2px 8px}
figcaption .t a{margin-left:auto;font-size:12px;color:#33475B;cursor:pointer;background:#F1F5F9;border-radius:10px;padding:3px 10px;font-weight:700;border:0}
figcaption p{margin:0;font-size:13.5px;line-height:1.65;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,16,26,.88);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb .close{position:fixed;top:14px;right:18px;color:#fff;font-size:15px;background:rgba(255,255,255,.15);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700}

/* ===== 屏幕内样式 ===== */
.scr{position:relative;width:844px;height:390px;overflow:hidden;background:#9DE2FA;font-family:'Noto Sans SC','PingFang SC',sans-serif;color:var(--ink);user-select:none}
.scr .bg{position:absolute;left:0;top:0;width:844px;height:390px}
.scr .abs{position:absolute}
.scr button{font-family:inherit}
.scr .cbtn{position:absolute;width:48px;height:48px;border-radius:15px;border:0;padding:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(#FFFDF6,#FFF0D3);box-shadow:inset 0 -4px 0 #F0D3A2,0 3px 0 rgba(150,100,40,.25),0 6px 12px rgba(30,50,70,.2)}
.scr .cbtn.sm{width:40px;height:40px;border-radius:13px}
.scr .cbtn:active{transform:translateY(2px)}
.scr .ic-t{color:#FF8A00;text-shadow:0 2px 0 #D66A00;line-height:1}
.scr .seg{position:absolute;height:48px;display:flex;align-items:center;gap:2px;padding:0 10px;border-radius:16px;background:rgba(26,32,44,.78);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.15)}
.scr .seg button{position:relative;border:0;background:none;cursor:pointer;width:44px;height:44px;font-family:'ZCOOL KuaiLe';font-size:27px;color:rgba(255,255,255,.4);padding:0}
.scr .seg button.done{color:#FFE2A0}
.scr .seg button.on{color:#FFAE1F;text-shadow:0 0 12px rgba(255,174,31,.6)}
.scr .seg button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:4px;border-radius:2px;background:#FFAE1F}
.scr .seg button i{position:absolute;right:3px;top:4px;width:9px;height:9px;border-radius:50%;background:#5FC23E;box-shadow:0 0 0 2px rgba(26,32,44,.78)}
.scr .olabel{font-family:'ZCOOL KuaiLe';font-size:14px;color:#fff;white-space:nowrap;line-height:1.1;
  text-shadow:0 2px 0 #E0700F,2px 0 0 #E0700F,-2px 0 0 #E0700F,0 -2px 0 #E0700F,1.5px 1.5px 0 #E0700F,-1.5px 1.5px 0 #E0700F,1.5px -1.5px 0 #E0700F,-1.5px -1.5px 0 #E0700F,0 4px 4px rgba(0,0,0,.2)}
.scr .pill{position:absolute;height:34px;border-radius:17px;padding:0 14px 0 5px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 4px 10px rgba(30,60,90,.15);font:900 16px Nunito,'Noto Sans SC';color:#5A3A12;white-space:nowrap}
.scr .pill.sm{height:30px;font-size:14px;padding:0 10px 0 6px}
.scr .pill svg{display:block}
.scr .avatar{position:absolute;width:60px;height:60px;border-radius:50%;background:linear-gradient(#FFF9EC,#FFE7BC);border:4px solid #FFA51F;box-shadow:0 4px 10px rgba(0,0,0,.2);display:flex;justify-content:center;overflow:visible}
.scr .avatar>svg{border-radius:0 0 30px 30px}
.scr .avatar .lv{position:absolute;right:-8px;bottom:-6px;background:linear-gradient(#5FB5FF,#2F7FE0);color:#fff;font:900 11px Nunito;border-radius:9px;padding:2px 6px;border:2px solid #fff}
.scr .taskbar{position:absolute;height:38px;border-radius:19px;padding:0 6px 0 14px;display:flex;align-items:center;gap:8px;background:rgba(26,32,44,.6);color:#fff;font-size:13px;font-weight:700}
.scr .taskbar .bar{width:64px;height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.scr .taskbar .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#9BEA62,#4FC23A)}
.scr .taskbar b{font-family:Nunito;font-weight:900}
.scr .topicon{position:absolute;border:0;background:none;padding:0;width:60px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.scr .topicon .olabel{position:static;font-size:13px;margin-top:-4px}
.scr .dock{position:absolute;display:flex;gap:4px}
.scr .dock button{border:0;background:none;width:70px;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.scr .dock .olabel{position:static;font-size:13.5px;margin-top:-2px}
.scr .book-badge{position:absolute;display:flex;align-items:center;gap:4px;padding:4px 12px 4px 4px;border-radius:16px;background:linear-gradient(100deg,#3D8BF2,#6FB2FF);color:#fff;font-size:12px;line-height:1.2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 4px 10px rgba(0,0,0,.18)}
.scr .book-badge b{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:17px}
.scr .go{position:absolute;width:82px;height:82px;border-radius:50%;border:4px solid #fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(circle at 35% 30%,#FFD66B,#FF9A1F 60%,#E8700A);box-shadow:inset 0 -5px 0 rgba(160,60,0,.3),0 6px 14px rgba(200,90,0,.35);color:#fff;font-family:'ZCOOL KuaiLe';font-size:18px;text-shadow:0 2px 0 #C45A00;animation:pulse 1.8s ease-in-out infinite}
.scr .bubble{position:absolute;background:#fff;border-radius:20px;padding:10px 14px;font-weight:900;font-size:16px;color:#3A2A1A;box-shadow:0 6px 14px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.35}
.scr .bubble i{position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid #fff;border-left:0}
.scr .bubble.left i{left:auto;right:-10px;border-right:0;border-left:12px solid #fff}
.scr .bubble .stars{display:flex}
.scr .say{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 8px;border-radius:17px;background:linear-gradient(#FFB33B,#FF8A00);box-shadow:inset 0 -3px 0 #D66A00;color:#fff;font:900 18px Nunito}
.scr .wm{position:absolute;color:rgba(255,255,255,.09);font-family:'Kaiti SC','STKaiti',serif;word-break:break-all;pointer-events:none}
.scr .piccard{position:absolute;padding:6px;border-radius:28px;background:#fff;box-shadow:0 8px 0 rgba(80,60,180,.25),0 14px 24px rgba(40,30,120,.25)}
.scr .piccard .cap{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:linear-gradient(#FFB33B,#FF8A00);color:#fff;font-weight:900;font-size:14px;border-radius:14px;padding:4px 14px;white-space:nowrap;box-shadow:inset 0 -3px 0 #D66A00}
.scr .charcard{position:absolute;padding:7px;border-radius:26px;background:#fff;box-shadow:0 8px 0 rgba(80,60,180,.25),0 14px 24px rgba(40,30,120,.25)}
.scr .tzg{position:relative;border-radius:18px;background:#FFFDF8;display:grid;place-items:center;overflow:hidden}
.scr .tzg.big{position:absolute;border:7px solid #fff;box-shadow:0 8px 0 rgba(40,110,20,.3),0 14px 24px rgba(20,60,10,.25);box-sizing:content-box}
.scr .tzg .grid{position:absolute;left:0;top:0}
.scr .tzg span{position:relative;color:#2E2622;line-height:1}
.scr .charcard .py{position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:#fff;border-radius:16px;padding:2px 18px;font:900 26px Nunito;color:#E2700A;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.scr .words{position:absolute;display:flex;flex-direction:column;gap:12px}
.scr .words button{border:0;width:100px;padding:6px 0 8px;border-radius:16px;background:linear-gradient(#FFFDF6,#FFF0D3);box-shadow:inset 0 -4px 0 #F0D3A2,0 6px 12px rgba(40,30,120,.2);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.scr .words small{font:800 12px Nunito;color:#8A6A3A}
.scr .words span{font-family:'Kaiti SC','STKaiti',serif;font-size:26px;font-weight:700;color:#3A2A1A;line-height:1.1}
.scr .words b{color:#FF7A00}
.scr .prompt{position:absolute;height:48px;border-radius:24px;padding:0 20px 0 7px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06),0 6px 14px rgba(30,60,90,.2);font-weight:900;font-size:17px;white-space:nowrap}
.scr .prompt b{color:#E2700A;font-family:Nunito;font-size:22px}
.scr .prompt small{color:#8A97A8;font-size:13px}
.scr .prompt .say{padding:0 8px;width:36px;justify-content:center}
.scr .fruits{position:absolute;display:flex;gap:8px;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.3)}
.scr .strokes{position:absolute;width:132px;padding:10px;border-radius:20px;background:linear-gradient(#FFFDF6,#FFF0D3);box-shadow:inset 0 -4px 0 #F0D3A2,0 8px 16px rgba(20,60,10,.25)}
.scr .strokes h4{margin:0 0 6px;font-family:'ZCOOL KuaiLe';font-weight:400;font-size:17px;text-align:center;color:#8F5527}
.scr .so{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:12px;font-weight:900;font-size:15px}
.scr .so i{font:900 12px Nunito;font-style:normal;width:20px;height:20px;border-radius:50%;background:#E7D6BC;color:#fff;display:grid;place-items:center}
.scr .so.on{background:#FFE2B0;color:#C45A00}
.scr .so.on i{background:#FF8A00}
.scr .speakcard{position:absolute;width:300px;height:180px;border-radius:26px;background:#fff;box-shadow:0 8px 0 rgba(170,80,30,.25),0 14px 24px rgba(120,50,10,.2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.scr .speakcard .big{font-family:'Kaiti SC','STKaiti',serif;font-size:92px;line-height:1;color:#2E2622}
.scr .speakcard .pyl{font:900 26px Nunito;color:#E2700A}
.scr .speakcard .phr{font-size:13px;color:#8A6A3A;font-weight:700;margin-top:2px}
.scr .wave{position:absolute;display:flex;align-items:center;gap:5px;height:40px}
.scr .wave i{display:block;width:7px;border-radius:4px;background:#fff;opacity:.9;animation:eq 1s ease-in-out infinite alternate}
.scr .rec{position:absolute;width:84px;height:84px;border-radius:50%;border:5px solid #fff;cursor:pointer;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFB3A3,#FF6F61 60%,#D5443A);box-shadow:0 0 0 10px rgba(255,111,97,.25),0 8px 16px rgba(150,40,20,.35);animation:ring 1.6s ease-out infinite}
.scr .dim{position:absolute;inset:0;background:rgba(20,16,50,.5);backdrop-filter:blur(3px)}
.scr .modal{position:absolute;width:420px;padding:18px 20px 14px;border-radius:28px;background:#fff;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.scr .xbtn{position:absolute;right:-16px;top:-16px;width:44px;height:44px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#FFA594,#F45A44);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.scr .evo{display:flex;gap:12px}
.scr .evo .col{position:relative;flex:1;border-radius:14px;overflow:visible;background:#FFF6E2;display:flex;flex-direction:column;align-items:center;padding-bottom:6px;box-shadow:inset 0 -3px 0 #F2DDB5}
.scr .evo .col b{width:100%;text-align:center;color:#fff;border-radius:14px 14px 0 0;padding:5px 0;font-size:15px}
.scr .evo .col em{position:absolute;right:-12px;top:62px;font-style:normal;color:#E2700A;font-weight:900;font-size:20px}
.scr .modal hr{border:0;border-top:3px dashed #F2D6A6;margin:14px 0 10px}
.scr .modal p{margin:0;font-size:16px;line-height:1.7;font-weight:500}
.scr .modal p b{color:#E2700A}
.scr .evo-foot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:#8A6A3A;font-weight:700}
.scr .title-ribbon{position:absolute;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'ZCOOL KuaiLe';font-size:22px;color:#fff;
  background:linear-gradient(#FFB33B,#FF8A00);box-shadow:inset 0 -4px 0 #D66A00,0 6px 12px rgba(0,0,0,.18);text-shadow:0 2px 0 #C45A00}
.scr .title-ribbon.green{background:linear-gradient(#7BD655,#45A82E);box-shadow:inset 0 -4px 0 #2F7F24,0 6px 12px rgba(0,0,0,.18);text-shadow:0 2px 0 #2F7F24}
.scr .title-ribbon.blue{background:linear-gradient(#6FB2FF,#3D8BF2);box-shadow:inset 0 -4px 0 #2366C9,0 6px 12px rgba(0,0,0,.25);text-shadow:0 2px 0 #2366C9}
.scr .note{position:absolute;font-size:13px;font-weight:700;color:#1F4A2F;background:rgba(255,255,255,.75);border-radius:12px;padding:4px 12px;white-space:nowrap}
.scr .note.small{font-size:12px}
.scr .note.dark{background:rgba(0,0,0,.25);color:#E8F6F2}
.scr .pettag{position:absolute;width:104px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.scr .pettag b{font-family:'ZCOOL KuaiLe';font-weight:400;font-size:20px;color:#fff;text-shadow:0 2px 0 #3E8F2A,2px 0 0 #3E8F2A,-2px 0 0 #3E8F2A,0 -2px 0 #3E8F2A}
.scr .pettag .cost{display:flex;align-items:center;gap:3px;background:#fff;border-radius:10px;padding:1px 8px;font:900 13px Nunito,'Noto Sans SC';color:#8F5527}
.scr .pettag em{font-style:normal;font-size:11.5px;font-weight:700;color:#1F4A2F;background:rgba(255,255,255,.7);border-radius:8px;padding:1px 6px;white-space:nowrap}
.scr .stars3{position:absolute;display:flex;align-items:flex-end;gap:2px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.scr .ribbon{position:absolute;width:216px;height:52px;display:flex;align-items:center;justify-content:center;font-family:'ZCOOL KuaiLe';font-size:28px;color:#fff;text-shadow:0 3px 0 #A3281F;
  background:linear-gradient(#FF8A7D,#E8483B);border-radius:12px;box-shadow:inset 0 -5px 0 #B9352A,0 8px 16px rgba(0,0,0,.2)}
.scr .ribbon::before,.scr .ribbon::after{content:"";position:absolute;top:14px;width:36px;height:40px;background:#C93A2C;z-index:-1}
.scr .ribbon::before{left:-24px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
.scr .ribbon::after{right:-24px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
.scr .reward{position:absolute;width:284px;padding:12px 16px;border-radius:24px;background:linear-gradient(#FFFDF6,#FFF0D3);box-shadow:inset 0 -5px 0 #F0D3A2,0 10px 20px rgba(0,0,0,.18)}
.scr .reward h4{margin:0 0 6px;font-family:'ZCOOL KuaiLe';font-weight:400;font-size:20px;color:#8F5527}
.scr .reward .row{display:flex;align-items:center;gap:10px;height:38px;font-weight:900;font-size:15px}
.scr .reward .row b{margin-left:auto;font:900 20px Nunito;color:#E2700A}
.scr .reward .xp{display:flex;align-items:center;gap:6px;font:900 12px Nunito;color:#8F5527;margin:-4px 0 4px 40px}
.scr .bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden}
.scr .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#9BEA62,#4FC23A)}
.scr .mini-card{width:30px;height:30px;border-radius:8px;background:#fff;border:2px solid #FFC93C;display:grid;place-items:center;font-size:20px;font-weight:700}
.scr .btn{position:absolute;height:48px;border:0;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'ZCOOL KuaiLe';font-size:20px}
.scr .btn.cream{background:linear-gradient(#FFFDF6,#FFF0D3);box-shadow:inset 0 -4px 0 #F0D3A2,0 6px 12px rgba(0,0,0,.18);color:#C45A00}
.scr .btn.orange{background:linear-gradient(#FFB33B,#FF8A00);box-shadow:inset 0 -4px 0 #D66A00,0 6px 12px rgba(200,90,0,.3);color:#fff;text-shadow:0 2px 0 #C45A00}
.scr .board{position:absolute;width:464px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;border-radius:24px;background:rgba(255,255,255,.55);box-shadow:0 10px 20px rgba(0,0,0,.12)}
.scr .day{position:relative;height:110px;border-radius:16px;background:linear-gradient(#FFFDF6,#FFF0D3);box-shadow:inset 0 -4px 0 #F0D3A2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 0 8px;overflow:hidden}
.scr .day b{width:100%;text-align:center;background:#FFC86A;color:#7A4300;font-size:13px;padding:3px 0}
.scr .day span{font:900 13px Nunito,'Noto Sans SC';color:#8F5527}
.scr .day.got{opacity:.75}
.scr .day .stamp{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-18px 0 0 -23px;border-radius:50%;background:rgba(95,194,62,.92);color:#fff;font-style:normal;font-size:28px;font-weight:900;display:grid;place-items:center;transform:rotate(-12deg);border:3px solid #fff}
.scr .day.today{box-shadow:inset 0 -4px 0 #F0D3A2,0 0 0 4px #FF8A00,0 0 18px rgba(255,138,0,.6)}
.scr .day.today b{background:#FF8A00;color:#fff}
.scr .day.today em{position:absolute;bottom:6px;font-style:normal;background:linear-gradient(#FFB33B,#FF8A00);color:#fff;font-size:13px;font-weight:900;border-radius:10px;padding:2px 12px;box-shadow:inset 0 -2px 0 #D66A00}
.scr .day.today span{visibility:hidden}
.scr .day.d7{grid-column:span 2;background:linear-gradient(#FFF1C2,#FFD77A);box-shadow:inset 0 -4px 0 #E7B04A}
.scr .day.d7 b{background:#E8483B;color:#fff}
.scr .timepanel{position:absolute;width:220px;padding:12px 14px;border-radius:24px;background:linear-gradient(#FFFDF6,#FFF0D3);box-shadow:inset 0 -5px 0 #F0D3A2,0 10px 20px rgba(0,0,0,.15)}
.scr .timepanel h4{margin:0;text-align:center;font-family:'ZCOOL KuaiLe';font-weight:400;font-size:18px;color:#8F5527}
.scr .ring{width:96px;height:96px;margin:6px auto;border-radius:50%;background:conic-gradient(#5FC23E calc(var(--p)*1%),#EBDDC5 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.scr .ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#FFF8E8}
.scr .ring b,.scr .ring small{position:relative}

/* 动画 */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.scr .float{animation:float 3.2s ease-in-out infinite}
.scr .twinkle{animation:twinkle 2s ease-in-out infinite}

<body>
<header>
  <h1>课本乐园 v2 · 横屏卡通版</h1>
  <nav id="nav"></nav>
  <div class="zoom" id="zoom"><button data-z="fit">适应宽度</button><button data-z="1">100%</button><button data-z="1.25">125%</button><button data-z="1.5">150%</button></div>
</header>
<main>
  <div class="intro">参考你给的截图重新做的风格:<b>横屏大场景</b>(天空、云、草地、蘑菇屋)、<b>奶油色 3D 圆角按钮</b>、<b>深色药丸步骤条</b>(玩·认·练·写·说)、<b>黏土质感的小伙伴</b>、橙色描边标题字。
  每张图都是 iPhone 横屏 844×390 真实尺寸,默认「适应宽度」放大显示;点每张右上角「全屏看」可铺满屏幕。关卡页的步骤条和「古」按钮可以点。所有插画都是代码画的矢量图,放大不会糊。</div>
  <div id="app"></div>
</main>
<div class="lb" id="lb"><button class="close" id="lbclose">关闭 (Esc)</button><div id="lbbody"></div></div>
<script src="art.js"></script>
<script src="screens.js"></script>
<script>
document.body.insertAdjacentHTML('afterbegin', DEFS);
const app = document.getElementById('app');
const states = {};
let zoom = 'fit';
try { zoom = localStorage.getItem('v2zoom') || 'fit'; } catch (e) {}

function renderScreen(s) { return `<div class="scr" data-id="${s.id}">${s.render(states[s.id] || s.state || {})}</div>`; }
function build() {
  let html = '', grp = '';
  const groups = [];
  SCREENS.forEach(s => {
    if (s.group !== grp) {
      if (grp) html += '</div>';
      grp = s.group; groups.push(grp);
      html += `<h2 class="grp" id="g${groups.length}">${grp}</h2><div class="grid">`;
    }
    states[s.id] = states[s.id] || (s.state ? { ...s.state } : {});
    html += `<figure data-fig="${s.id}"><div class="bezel"><div class="holder"><div class="scale">${renderScreen(s)}</div></div></div>
      <figcaption><div class="t">${s.title}${s.lesson ? '<span class="tag">可点击</span>' : ''}<button class="full" data-full="${s.id}" type="button">全屏看</button></div><p>${s.note}</p></figcaption></figure>`;
  });
  html += '</div>';
  app.innerHTML = html;
  document.getElementById('nav').innerHTML = groups.map((g, i) => `<a href="#g${i + 1}">${g}</a>`).join('');
  applyZoom();
}
function scaleFor() {
  if (zoom !== 'fit') return +zoom;
  const avail = app.clientWidth - 24;
  return Math.max(.5, Math.min(1.6, avail / 844));
}
function applyZoom() {
  const z = scaleFor();
  document.querySelectorAll('figure').forEach(f => {
    const h = f.querySelector('.holder'), sc = f.querySelector('.scale');
    h.style.width = 844 * z + 'px'; h.style.height = 390 * z + 'px';
    sc.style.transform = `scale(${z})`;
    f.style.width = 844 * z + 24 + 'px';
  });
  document.querySelectorAll('#zoom button').forEach(b => b.classList.toggle('on', b.dataset.z === String(zoom)));
}
function rerender(id) {
  const s = SCREENS.find(x => x.id === id);
  document.querySelectorAll(`.scr[data-id="${id}"]`).forEach(el => { el.innerHTML = s.render(states[id]); });
}
document.addEventListener('click', e => {
  const scr = e.target.closest('.scr');
  if (scr) {
    const id = scr.dataset.id, st = states[id];
    const stepBtn = e.target.closest('[data-step]');
    if (stepBtn && st && 'step' in st) { st.step = +stepBtn.dataset.step; st.gu = false; rerender(id); return; }
    if (e.target.closest('[data-act="gu"]') && st && 'gu' in st) { st.gu = !st.gu; rerender(id); return; }
  }
  const z = e.target.closest('#zoom button');
  if (z) { zoom = z.dataset.z; try { localStorage.setItem('v2zoom', zoom); } catch (err) {} applyZoom(); return; }
  const full = e.target.closest('[data-full]');
  if (full) openLb(full.dataset.full);
});
function openLb(id) {
  const s = SCREENS.find(x => x.id === id);
  const z = Math.min((innerWidth - 40) / 844, (innerHeight - 80) / 390);
  document.getElementById('lbbody').innerHTML = `<div class="holder" style="width:${844 * z}px;height:${390 * z}px;border-radius:${40 * z}px"><div class="scale" style="transform:scale(${z})">${renderScreen(s)}</div></div>`;
  document.getElementById('lb').classList.add('on');
}
document.getElementById('lbclose').onclick = () => document.getElementById('lb').classList.remove('on');
document.getElementById('lb').addEventListener('click', e => {
  if (e.target.id === 'lb') e.currentTarget.classList.remove('on');
});
addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lb').classList.remove('on'); });
addEventListener('resize', () => { if (zoom === 'fit') applyZoom(); });
build();
</script>
</body>
</html>
